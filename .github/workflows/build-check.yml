name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Runtime functions exist
        run: python tools/ci/check-runtime-symbols.py src external/xboxrecomp/src

      - name: Configure CMake (Windows D3D11 + SDL3)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Windows Binary
        run: cmake --build build --config Release --parallel

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl3-dev libssl-dev libepoxy-dev

      - name: Configure CMake (Linux POSIX + SDL3 GPU)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Linux Binary
        run: cmake --build build --parallel