; My NFL Eras: the broadcast presentation package an Eras game uses (M9).
;
;   <season>        = <package>     e.g. 1980 = NFL on CBS
;   <first>-<last>  = <package>     e.g. 1978-1989 = NFL on CBS
;   <decade>s       = <package>     e.g. 1980s = NFL on CBS
;
; <package> is a folder under mods\presentations or the package's display name.
; The most specific line wins (season, then range, then decade). If the package
; is not installed, or no line matches, the player's own selection (Coach Match
; Up > Presentation) is kept. The player's selection is put back after the game
; and is never saved over; Quick Game, Franchise and the other modes never read
; this file.
;
; Packages draw the era logo the game sends in team.logo. JSON packages (NFL on
; CBS, NFL on FOX, CBS style) always use it. HTML packages that prefer their own
; per-abbreviation art (assets\logos\<ABBR>.png, which is 2004 art: BAL there is
; the Ravens) should use team.logo when state.league is "eras"
; (docs/PRESENTATION-SYSTEM.md).

1980s = NFL on CBS
