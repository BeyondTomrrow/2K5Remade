; My NFL Eras office look: 1990s (the front office). See ..\README.txt.

[room]
scene = front_office

[stops]
; play: the entrance dolly backwards, out of the office (a < 0)
play = -1, 0
schedule = 3, 5
standings = 3, 5
team = 7, 9
settings = 3, 5

[grade]
; cherry wood, hunter green, teal carpet, beige CRT. The computer screen and the wall TV
; picture are made images in this folder (computer_screen.png, wall_tv_picture.png).
front_office_atlas         = tint 0.36 0.52 0.40 0.45, sat 0.85
front_office_atlas_wall_tv = tint 0.36 0.52 0.40 0.45, sat 0.85
carpet                     = tint 0.30 0.56 0.56 0.85, contrast 1.1
wood_panel                 = tint 0.70 0.36 0.26 0.55
drawer_face                = tint 0.70 0.36 0.26 0.55
computer_monitor           = tint 0.62 0.57 0.46 0.95, bright 1.05
