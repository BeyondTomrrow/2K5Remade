; My NFL Eras office look: 2020s-2025 (the front office, no desk phone). See ..\README.txt.

[room]
scene = front_office

[hide]
nodes = phone_group, phone_shadow

[stops]
play = -1, 0
schedule = 3, 5
standings = 3, 5
team = 7, 9
settings = 3, 5

[grade]
; white walls, white oak, light grey carpet, black screens. The computer screen and the wall
; TV picture are made images in this folder.
front_office_atlas         = sat 0.20, bright 1.18, mul 1.0 1.0 1.03
front_office_atlas_wall_tv = sat 0.20, mul 0.35 0.35 0.37
office_atlas_wall_tv       = sat 0.20, mul 0.35 0.35 0.37
wood_panel                 = sat 0.45, bright 1.30, mul 1.05 1.0 0.90
drawer_face                = sat 0.45, bright 1.30, mul 1.05 1.0 0.90
carpet                     = sat 0.10, mul 0.80 0.80 0.83
computer_monitor           = sat 0.2, mul 0.28 0.28 0.30, contrast 1.2
