; My NFL Eras office look: 1980s (also the 1980 season's office: Auto = the season's decade).
; See ..\README.txt. Each key here replaces the built-in default.
;
; An early-80s coach's office: dark walnut wall paneling, rust shag carpet, a honey-oak veneer
; desk, an IBM PC 5150 with its keyboard, a beige multi-line desk phone, a brass desk lamp, an
; amber glass ashtray, a framed 1980 schedule poster, a felt pennant, sepia team photos,
; chestnut leather couch, tan steel file cabinets.
;
; The room is coach_d80s, made by tools\eras\build-office-ibmpc.py from the Coach's Desk (the
; computer, keyboard, phone, ashtray, poster and pennant are reshaped props of our own copy;
; their texture is computer_monitor.png in this folder). Without that record the look falls back
; to coach_desk. The images in this folder are drawn by tools\eras\make-office-art.py (room
; surfaces) and build-office-ibmpc.py (computer_monitor.png); no retail pixels.

[room]
scene = coach_d80s

[hide]
; nothing: the notebook sticker quad is the ashtray in coach_d80s (its old texture was the
; monitor wallpaper, so it was hidden here before)
nodes =

[grade]
; Images replace office_atlas (paneling, books, day planner, binder), carpet, desk_metal (the
; desk veneer), wood_panel (door, end table, floor lamp) and coffee_table_wood (shelf, coffee
; table). The grades below recolour the game's own pixels of the rest.
skin_wall_photos  = tint 0.70 0.55 0.38 0.65, contrast 0.88, bright 1.06
couch_leather_1   = tint 0.42 0.22 0.12 1.0, bright 1.30, add 0.03 0.01 0
couch_leather_2   = tint 0.42 0.22 0.12 1.0, bright 1.30, add 0.03 0.01 0
couch_leather_3   = tint 0.42 0.22 0.12 1.0, bright 1.30, add 0.03 0.01 0
couch_leather_4   = tint 0.42 0.22 0.12 1.0, bright 1.30, add 0.03 0.01 0
file_cabinet      = tint 0.64 0.56 0.42 0.9, bright 1.3
blotter           = tint 0.20 0.34 0.22 0.85
desk_lamp_a       = tint 0.86 0.66 0.30 0.85, bright 1.1
desk_lamp_b       = tint 0.86 0.66 0.30 0.85, bright 1.1
floor_lamp_shade  = sat 0.35, bright 1.25, mul 1.0 0.92 0.76
floor_lamp_base   = tint 0.86 0.66 0.30 0.6
