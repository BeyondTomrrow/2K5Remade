; My NFL Eras office look: 1970s (the den). Read by the game (src/nfl2k5_eras_office.c for
; [room] [hide] [swap] [stops]; src/nfl2k5_texture_packs.cpp for [grade]). Each key here
; replaces the built-in default. Texture names: ..\office-textures.ini. See ..\README.txt.

[room]
scene = coach_desk

[hide]
; no computer yet; the cordless phone waits for a period phone model
nodes = monitor_group1, teamwallpaper, monitor_shadow, mousepad, phone_group1

[swap]
; the glass desk top takes the oak panel's texture: a wooden desk
vcSwShader16 = vcHwShader27

[stops]
; no monitor: Standings opens at the file cabinets
standings = 17, 19
settings = 17, 19

[grade]
; walnut paneling, olive-gold shag, brown vinyl couch, avocado cabinets, sepia photos.
; grade = sat s, contrast c, bright b, mul r g b, add r g b, tint r g b amount (on the game's own pixels)
office_atlas      = tint 0.66 0.42 0.24 0.75, contrast 1.05
wood_panel        = tint 0.62 0.38 0.22 0.8, bright 0.72, contrast 1.1
coffee_table_wood = tint 0.66 0.42 0.24 0.5, bright 0.9
carpet            = tint 0.56 0.52 0.26 0.85, contrast 1.2, bright 0.85
couch_leather_1   = tint 0.55 0.34 0.20 1.0, bright 1.35, add 0.04 0.02 0
couch_leather_2   = tint 0.55 0.34 0.20 1.0, bright 1.35, add 0.04 0.02 0
couch_leather_3   = tint 0.55 0.34 0.20 1.0, bright 1.35, add 0.04 0.02 0
couch_leather_4   = tint 0.55 0.34 0.20 1.0, bright 1.35, add 0.04 0.02 0
file_cabinet      = tint 0.50 0.58 0.28 0.85, bright 1.15
blotter           = tint 0.55 0.40 0.22 0.8
skin_wall_photos  = tint 0.62 0.48 0.32 0.55
