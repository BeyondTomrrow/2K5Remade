; MyCareer home -- the Crib's items for our apartment, house and mansion.
;
; One line an item:   id = Name | tier | price | slot | source | price from
;   tier     apartment, house or mansion. Tiers stack: an apartment item can go in the house
;            and the mansion, a house item in the mansion.
;   price    MyCareer dollars, from the bank. "price from" says where it came from: "crib N" is
;            the Crib's own catalogue price in Crib Credits (cribdata), times 1,000; "ours" is
;            set here (the Crib gave these as milestone rewards, without a price).
;   slot     wall, floor, floor_corner, wall_floor (against a wall), big_floor, table_top,
;            shelf, ceiling -- each room has fixed slots of these kinds.
;   source   what draws it: crib.iff:<node> is a node of the Crib scene; crib_<x>.iff a Crib
;            furniture file, #modelN its model choice and #lookN its texture choice (the
;            Crib's item cache for posters, banners, pennants and photos).
; Edit freely: change a tier or price, or delete a line to take an item out of the shop.

