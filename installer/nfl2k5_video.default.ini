; NFL 2K5 video settings (F1 in game edits these)
; mode: 0 windowed, 1 borderless fullscreen (your desktop resolution), 2 exclusive fullscreen
mode = 1
resolution = 1920x1080
; aspect: 0 fit the screen keeping 16:9 proportions, 1 stretch, 2 16:9, 5 zoom to fill
aspect = 0
; scale: internal resolution = 720x480 times this (1..9)
scale = 3
; filter: 0 bilinear, 1 sharp bilinear, 2 nearest, 3 enhanced
filter = 3
vsync = 1
brightness = 100
gamma = 100
; crop: pixels of the 720-wide picture cut from the left and right (0 = none)
crop = 0
show_fps = 0
aniso = 8
; fps_limit: 30 locks 30; 60, 120 and 0 lock 60 in every camera (the game
; simulates at most 60 frames a second); -1 original: the game's own 30/60 per camera
fps_limit = 0
